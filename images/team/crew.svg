<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="Crew Photo">
  <rect width="100%" height="100%" fill="#6f665c"/>
  <rect width="100%" height="100%" fill="url(#diag)"/>
  <defs>
    <pattern id="diag" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#000000" stroke-opacity="0.05" stroke-width="14"/>
    </pattern>
  </defs>
  <text x="50%" y="50%" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700"
        fill="#f7f3ea" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">Crew Photo</text>
  <text x="50%" y="336.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f7f3ea" fill-opacity="0.75" text-anchor="middle">Replace with real crew/jobsite photo</text>
  <rect x="0" y="590" width="900" height="10" fill="#b5502d"/>
</svg>